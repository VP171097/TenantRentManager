name: Build Signed Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Capacitor
        run: |
          yarn add @capacitor/core @capacitor/android
          yarn add -D @capacitor/cli

      - name: Create Capacitor configuration
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.vivekpandey.tenantrentmanager',
            appName: 'Tenant Rent Manager',
            webDir: 'dist',
            server: {
              androidScheme: 'https'
            }
          };

          export default config;
          EOF

      - name: Build web application
        run: yarn build --mode capacitor
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Add Android platform if needed
        run: |
          if [ -d android ]; then
            echo "Android platform already exists. Skipping cap add android."
          else
            yarn cap add android
          fi

      - name: Sync Capacitor
        run: yarn cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH

          SDKMANAGER=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_SDK_ROOT" -name sdkmanager -type f | head -n 1)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" "platform-tools"
          "$SDKMANAGER" "platforms;android-35"
          "$SDKMANAGER" "build-tools;35.0.0"

      # Restore keystore INSIDE android/app
      - name: Restore Android signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app/keystore

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/keystore/tenant-rent-manager-release.jks

          if [ ! -s android/app/keystore/tenant-rent-manager-release.jks ]; then
            echo "ERROR: Keystore file was not created."
            exit 1
          fi

          echo "Keystore restored successfully."

      # Configure signing
      - name: Configure Android signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        working-directory: android
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle")
          text = path.read_text()

          # Remove previously injected signing configuration
          import re

          text = re.sub(
              r'\s*signingConfigs\s*\{.*?\n\s*\}',
              '',
              text,
              count=1,
              flags=re.DOTALL
          )

          # Add signing configuration
          signing_block = '''
              signingConfigs {
                  release {
                      storeFile file("keystore/tenant-rent-manager-release.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEYSTORE_PASSWORD")
                  }
              }
          '''

          text = text.replace(
              "android {",
              "android {" + signing_block,
              1
          )

          # Configure release build type
          if "signingConfig signingConfigs.release" not in text:
              text = text.replace(
                  "buildTypes {",
                  '''buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
                  ''',
                  1
              )

          path.write_text(text)
          PY

      # Verify keystore exists where Gradle expects it
      - name: Verify signing setup
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "Checking signing files..."

          ls -lh android/app/keystore/

          test -f android/app/keystore/tenant-rent-manager-release.jks

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: ANDROID_KEYSTORE_PASSWORD is missing."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: ANDROID_KEY_ALIAS is missing."
            exit 1
          fi

          echo "Signing setup verified."

      # Build signed APK
      - name: Build signed Release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      # Build signed AAB
      - name: Build signed Release AAB
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          ./gradlew bundleRelease

      # Verify outputs
      - name: Verify Release files
        run: |
          echo "Checking APK..."
          test -f android/app/build/outputs/apk/release/app-release.apk

          echo "Checking AAB..."
          test -f android/app/build/outputs/bundle/release/app-release.aab

          echo "APK:"
          ls -lh android/app/build/outputs/apk/release/app-release.apk

          echo "AAB:"
          ls -lh android/app/build/outputs/bundle/release/app-release.aab

      # Upload final files
      - name: Upload Release APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: tenant-rent-manager-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      # Delete private signing key from runner
      - name: Cleanup signing key
        if: always()
        run: |
          rm -f android/app/keystore/tenant-rent-manager-release.jks
