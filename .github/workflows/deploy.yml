name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify dependency lockfile
        run: |
          if [ ! -s yarn.lock ]; then
            echo "::error file=yarn.lock::Commit the root yarn.lock together with package.json before deploying."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Change these two lines — and nothing else in the codebase — when
          # moving to a custom domain or back to the default github.io one.
          # Custom domain (served from the root): VITE_SITE_URL: https://yourdomain.com/
          #                                        VITE_BASE_PATH: /
          # Default github.io project page:       VITE_SITE_URL: https://vp171097.github.io/TenantRentManager/
          #                                        VITE_BASE_PATH: /TenantRentManager/
          VITE_SITE_URL: https://vp171097.github.io/TenantRentManager/
          VITE_BASE_PATH: /TenantRentManager/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
