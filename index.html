<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;family=Lora:wght@400;500&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet" />
    <link rel="icon" type="image/png" sizes="1024x1024" href="%BASE_URL%assets/logo.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%assets/logo.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="RentBook helps Indian landlords manage rent collections, electricity readings, tenants and receipts in one organised place." />
    <meta name="robots" content="index,follow" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="RentBook — Rent, Simplified" />
    <meta property="og:description" content="Less chasing rent. More room for life. Your properties, electricity bills and receipts, together." />
    <meta property="og:url" content="%VITE_SITE_URL%" />
    <link rel="canonical" href="%VITE_SITE_URL%" />
    <meta name="twitter:card" content="summary" />
    <title>RentBook — Rent, Simplified</title>
    <style>
      /* Matches the app's real background instantly (before the CSS bundle
         or React has loaded) so refreshing/first-load never flashes
         unstyled black-on-white content — just a blank, correctly-themed
         screen for the split second before React mounts over it. */
      html { background: #faf7f0; }
      @media (prefers-color-scheme: dark) { html { background: #0c0a08; } }
      #root:has(> .app-shell-fallback) { min-height: 100vh; }
      .app-shell-fallback { display: none; }

      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #faf7f0;
        transition: opacity 0.25s ease;
      }
      @media (prefers-color-scheme: dark) { #app-splash { background: #0c0a08; } }
      #app-splash .app-splash-mark {
        display: flex;
        height: min(22vw, 96px);
        width: min(22vw, 96px);
        align-items: center;
        justify-content: center;
        border-radius: 24px;
        background: #0d9488;
        box-shadow: 0 8px 24px rgba(13,148,136,0.3);
      }
      #app-splash .app-splash-mark svg { width: 55%; height: 55%; color: #fff; }
      #app-splash .app-splash-wordmark { font-family: 'Playfair Display', Georgia, serif; font-weight: 700; font-size: 28px; color: #0f766e; }
      @media (prefers-color-scheme: dark) { #app-splash .app-splash-wordmark { color: #5eead4; } }
      #app-splash .app-splash-tagline { font-family: 'DM Sans', system-ui, sans-serif; font-size: 12px; color: #78716c; letter-spacing: 0.02em; }
      #app-splash.app-splash-hidden { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="app-splash">
      <div class="app-splash-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 12h4" /><path d="M10 8h4" /><path d="M14 21v-3a2 2 0 0 0-4 0v3" />
          <path d="M6 10H4a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-2" />
          <path d="M6 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16" />
        </svg>
      </div>
      <div class="app-splash-wordmark">RentBook</div>
      <div class="app-splash-tagline">Rent, Simplified.</div>
    </div>
    <div id="root"><main class="app-shell-fallback"><h1>RentBook — Rent, Simplified</h1><p>Less chasing rent. More room for life.</p><p>Manage properties, tenants, rent collections, electricity readings and PDF receipts in one organised place. Built for small property owners in India.</p><a href="login">Sign in to RentBook</a></main></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
